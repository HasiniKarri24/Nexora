<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthCopilot — AI-Powered Personal Health Copilot</title>
<style>
/* ============================== BASE ============================== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#0891b2; --p2:#0e7490; --p3:#ecfeff; --a:#14b8a6;
  --bd:#e2e8f0; --mut:#64748b; --dn:#ef4444; --wn:#f59e0b; --ok:#10b981;
  --card:#fff; --bg:#f1f5f9; --ink:#0f172a; --r:14px;
  --sd:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--bd);
  border-radius:10px;width:100%;outline:none;background:#fff;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(8,145,178,.12)}
textarea{resize:vertical;min-height:76px}
label{display:block;font-size:12.5px;font-weight:600;color:#334155;margin-bottom:6px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============================== ATOMS ============================== */
.btn{padding:10px 18px;border-radius:10px;background:var(--p);color:#fff;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--p2)}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--bd)}
.btn.ghost:hover{background:#f8fafc}
.btn.dark{background:#0f172a}.btn.dark:hover{background:#1e293b}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#059669}
.btn.danger{background:var(--dn)}.btn.danger:hover{background:#dc2626}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:4px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sd)}
.card.pad0{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.mut{color:var(--mut)}
.sm{font-size:12.5px}
.xs{font-size:11.5px}
.b{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.center{text-align:center}
.hidden{display:none!important}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.dn{background:#fee2e2;color:#b91c1c}
.badge.info{background:#e0f2fe;color:#0369a1}
.badge.grey{background:#f1f5f9;color:#475569}

.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;
  border:1px solid var(--bd);background:#fff;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--p);color:var(--p);background:var(--p3)}

.stat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sd)}
.stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px}

/* ============================== APP SHELL ============================== */
.app{display:flex;min-height:100vh}
.side{width:250px;flex:0 0 250px;background:#0b1220;color:#94a3b8;padding:14px 12px;
  display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{color:#fff;font-weight:800;font-size:17px;padding:10px 10px 14px;display:flex;gap:9px;align-items:center;letter-spacing:-.3px}
.side .brand .dot{width:9px;height:9px;border-radius:99px;background:var(--a);box-shadow:0 0 12px var(--a)}
.side .sect{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#475569;padding:14px 12px 6px;font-weight:700}
.side .nav{padding:9px 12px;border-radius:10px;color:#cbd5e1;font-size:13.5px;display:flex;gap:11px;
  align-items:center;cursor:pointer;transition:.13s;font-weight:500}
.side .nav:hover{background:#16233a;color:#fff}
.side .nav.active{background:linear-gradient(90deg,var(--p),var(--p2));color:#fff;font-weight:600}
.side .nav .ic{width:18px;text-align:center;font-size:14px}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid #1e293b}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--bd);padding:12px 22px;display:flex;
  justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;gap:14px}
.top h1{font-size:17px;font-weight:750;letter-spacing:-.3px}
.content{padding:22px;max-width:1240px;width:100%}
@media(max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;flex:none;height:auto;position:relative;flex-direction:row;overflow-x:auto;padding:8px}
  .side .brand,.side .sect{display:none}
  .side .nav{white-space:nowrap;font-size:12.5px;padding:8px 12px}
  .side .foot{margin:0;border:none;padding:0}
}

/* ============================== LANDING ============================== */
.land{background:#fff;min-height:100vh}
.landnav{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;
  border-bottom:1px solid var(--bd);position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);z-index:50}
.hero{padding:70px 32px 50px;text-align:center;max-width:940px;margin:0 auto}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-1.6px;font-weight:850}
.hero h1 .gr{background:linear-gradient(100deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:16.5px;color:#475569;max-width:660px;margin:18px auto 0;line-height:1.65}
.feat{padding:12px 32px 70px;max-width:1140px;margin:0 auto}
.fcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:var(--sd);transition:.2s}
.fcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.1)}
.fcard .ic{width:42px;height:42px;border-radius:12px;background:var(--p3);color:var(--p);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.steps{counter-reset:s;padding:20px 32px 70px;max-width:1140px;margin:0 auto}
.step{display:flex;gap:16px;padding:16px;border-radius:14px;background:#fff;border:1px solid var(--bd);box-shadow:var(--sd)}
.step .num{width:38px;height:38px;flex:0 0 38px;border-radius:11px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.sec-title{text-align:center;margin-bottom:34px}
.sec-title h2{font-size:29px;letter-spacing:-.9px;font-weight:800}
.sec-title p{color:var(--mut);margin-top:8px;font-size:14.5px}
footer{background:#0b1220;color:#94a3b8;padding:34px 32px;text-align:center;font-size:13px}

/* ============================== LOGIN ============================== */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 520px at 12% -8%,#cffafe 0%,transparent 60%),
             radial-gradient(900px 520px at 92% 108%,#ccfbf1 0%,transparent 60%),#f8fafc}
.loginbox{width:100%;max-width:430px}
.tabs{display:flex;gap:5px;background:#eef2f7;padding:5px;border-radius:12px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-size:13px;font-weight:650;color:#64748b;transition:.15s}
.tabs button.active{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(15,23,42,.1)}
.demo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ============================== CHAT ============================== */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 128px);min-height:460px}
.chatlog{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:#f8fafc;border-radius:var(--r)}
.msg{max-width:80%;padding:12px 15px;border-radius:15px;font-size:14px;line-height:1.62;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:#fff;border:1px solid var(--bd);border-bottom-left-radius:5px;box-shadow:var(--sd)}
.msg.ai.urgent{border-color:#fecaca;background:#fff5f5}
.srcbox{margin-top:10px;padding:9px 11px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;font-size:11.5px;color:#0f766e}
.srcbox b{display:block;margin-bottom:4px;letter-spacing:.4px;text-transform:uppercase;font-size:10px}
.chatbar{display:flex;gap:10px;padding-top:12px;align-items:flex-end}
.chatbar input{flex:1}

/* ============================== MISC ============================== */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:#475569;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.6px;font-weight:750;border-bottom:1px solid var(--bd)}
td{padding:11px 12px;border-bottom:1px solid #f1f5f9}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfc}

.drop{border:2px dashed #cbd5e1;border-radius:14px;padding:34px;text-align:center;background:#f8fafc;transition:.2s;cursor:pointer}
.drop:hover{border-color:var(--p);background:var(--p3)}
.prog{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--a));border-radius:99px;transition:width .4s}

.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--bd)}
.tli{position:relative;padding-bottom:18px}
.tli:before{content:"";position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:99px;
  background:var(--p);border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--p)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:200;
  display:grid;place-items:center;padding:20px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;
  box-shadow:0 25px 60px rgba(0,0,0,.3)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:#fff;z-index:2;border-radius:16px 16px 0 0}
.modal-h h3{font-size:16px;font-weight:750}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
  padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:600;z-index:999;
  box-shadow:0 12px 30px rgba(0,0,0,.3);animation:tin .25s ease}
.toast.ok{background:#059669}.toast.dn{background:#dc2626}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

.doc-card{display:flex;gap:14px;padding:16px;border:1px solid var(--bd);border-radius:14px;background:#fff;
  box-shadow:var(--sd);transition:.2s;align-items:flex-start}
.doc-card:hover{border-color:#a5f3fc;box-shadow:0 8px 24px rgba(8,145,178,.12)}
.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--a));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}

.med-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--bd);
  border-radius:12px;background:#fff;gap:12px;flex-wrap:wrap}
.med-row.taken{background:#f0fdf4;border-color:#bbf7d0}

.video-stage{background:#0b1220;border-radius:14px;aspect-ratio:16/9;display:grid;place-items:center;color:#64748b;position:relative}
.video-stage .self{position:absolute;right:14px;bottom:14px;width:130px;aspect-ratio:4/3;background:#1e293b;
  border-radius:10px;display:grid;place-items:center;color:#64748b;font-size:11px;border:1px solid #334155}
.vbar{display:flex;gap:10px;justify-content:center;padding:14px}
.vbtn{width:46px;height:46px;border-radius:99px;background:#1e293b;color:#fff;display:grid;place-items:center;font-size:17px;transition:.15s}
.vbtn:hover{background:#334155}
.vbtn.end{background:var(--dn)}.vbtn.end:hover{background:#dc2626}

.perm{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--bd);
  border-radius:12px;background:#fff;gap:12px;flex-wrap:wrap}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13.5px;cursor:pointer}
.checkline input{width:auto;margin:0}

.emergency-card{background:linear-gradient(135deg,#0b1220,#134e4a);color:#fff;border-radius:18px;padding:24px;
  box-shadow:0 20px 44px rgba(8,145,178,.28);max-width:520px}
.emergency-card .tag{display:inline-block;background:rgba(255,255,255,.14);padding:4px 11px;border-radius:99px;
  font-size:11px;font-weight:750;letter-spacing:1px;text-transform:uppercase}
.qr{width:126px;height:126px;background:#fff;border-radius:12px;display:grid;place-items:center;
  color:#0f172a;font-family:monospace;font-size:9px;text-align:center;padding:6px;line-height:1.25}

.bar{height:9px;border-radius:99px;background:#e2e8f0;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--p)}

.node{display:inline-block;padding:8px 14px;border-radius:11px;background:#fff;border:1px solid var(--bd);
  font-size:12.5px;font-weight:650;box-shadow:var(--sd)}
.node.p{background:#ecfeff;border-color:#a5f3fc;color:var(--p2)}
</style>
</head>

function toast(msg,type=''){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function fmtAI(t){
  return esc(t)

}

/* ============================================================================
   AI ENGINE  (Retrieval-augmented, grounded on the patient's own records)
   ============================================================================ */
const REF = {
  Hemoglobin:{min:13,max:17,unit:'g/dL',about:'Hemoglobin carries oxygen through your body.'},
  WBC:{min:4000,max:11000,unit:'/µL',about:'White blood cells help your body fight infection.'},
  Platelets:{min:1.5,max:4.5,unit:'L/µL',about:'Platelets help your blood to clot.'},
  Glucose:{min:70,max:100,unit:'mg/dL',about:'Glucose (sugar) is your body\'s main energy source.'},
  Cholesterol:{min:0,max:200,unit:'mg/dL',about:'Cholesterol is a fat found in your blood.'},
  Triglycerides:{min:0,max:150,unit:'mg/dL',about:'Triglycerides are a type of blood fat.'},
  HDL:{min:40,max:100,unit:'mg/dL',about:'HDL is often called "good" cholesterol.'},
  LDL:{min:0,max:100,unit:'mg/dL',about:'LDL is often called "bad" cholesterol.'}
};
const patientReports = pid => DB.reports.filter(r=>r.patientId===pid)
  .sort((a,b)=> new Date(b.date)-new Date(a.date));
const patientMeds = pid => DB.medicines.filter(m=>m.patientId===pid);
const patientAppts = pid => DB.appointments.filter(a=>a.patientId===pid)
  .sort((a,b)=> new Date(b.date)-new Date(a.date));
const patientTests = pid => DB.tests.filter(t=>t.patientId===pid);

function rangeStatus(k,v){
  const r=REF[k]; if(!r) return null;
  if(v<r.min) return 'below';
  if(v>r.max) return 'above';
  return 'within';
}

/* --- Report comparison (used by UI + AI) --- */
function buildComparison(pid){
  const rs = patientReports(pid).filter(r=>r.values && Object.keys(r.values).length>=3);
  if(rs.length<2) return null;
  const curr=rs[0], prev=rs[1];
  const keys=[...new Set([...Object.keys(prev.values),...Object.keys(curr.values)])];
  const rows=keys.map(k=>{
    const p=prev.values[k], c=curr.values[k];
    let dir='same';
    if(p!=null && c!=null){ if(c>p) dir='up'; else if(c<p) dir='down'; }
    return {key:k, prev:p, curr:c, dir, ref:REF[k]||null, status: c!=null?rangeStatus(k,c):null};
  });
  return {prev,curr,rows};
}

/* --- Main AI response generator --- */
function aiRespond(q, pid){
  const t = q.toLowerCase().trim();
  const sources = [];
  const meds = patientMeds(pid);
  const appts = patientAppts(pid);
  const reps = patientReports(pid);
  const cmp = buildComparison(pid);

  /* 1. Emergency escalation layer */
  if(/(chest pain|heart attack|can'?t breathe|cannot breathe|unconscious|severe bleeding|stroke|suicid|overdose|seizure|fainting)/.test(t)){
    return {urgent:true, sources:[],
      text:`**This may require urgent medical attention.**

I am not able to assess emergencies. Please contact your local emergency services or go to the nearest emergency department immediately.

If you are with someone, ask them to stay with you. Do not rely on this app for emergency decisions.`};
  }

  /* 2. Greeting */
  if(/^(hi|hello|hey|namaste|good (morning|evening|afternoon))\b/.test(t)){
    return {text:`Hello ${state.user?.name||''}! I'm your Health Copilot. 👋\n\nI can help you:\n• Explain your uploaded reports in simple language\n• Compare your latest report with a previous one\n• Summarise your medicines and appointments\n• Prepare questions for your doctor\n\nEverything I answer is grounded in **your own records**. I will tell you when I don't have enough information.`, sources:[]};
  }

  /* 3. Report comparison / "what changed" */
  if(/(compare|what changed|difference|changed|previous report|versus|vs\b|trend)/.test(t)){
    if(!cmp) return noInfo('report comparison');
    sources.push({file:cmp.curr.name,section:'All extracted values'},{file:cmp.prev.name,section:'All extracted values'});
    let out = `**Report Comparison**\n\n`;
    out += `Previous: ${cmp.prev.name} (${fmtD(cmp.prev.date)})\n`;
    out += `Latest: ${cmp.curr.name} (${fmtD(cmp.curr.date)})\n\n`;
    cmp.rows.forEach(r=>{
      if(r.prev==null||r.curr==null) return;
      const arrow = r.dir==='up'?'↑':r.dir==='down'?'↓':'→';
      const unit = r.ref?(' '+r.ref.unit):'';
      out += `• ${r.key}: ${r.prev}${unit} ${arrow} ${r.curr}${unit}`;
      if(r.status==='above') out += `  _(above the commonly used reference range)_`;
      else if(r.status==='below') out += `  _(below the commonly used reference range)_`;
      out += `\n`;
    });
    const changed = cmp.rows.filter(r=>r.dir!=='same').length;
    out += `\n**Summary:** ${changed} value(s) changed between these two reports.\n\n`;
    out += `This is an automated comparison of values found in your documents — not a diagnosis. Please discuss these changes with your healthcare professional.`;
    return {text:out, sources};
  }

  /* 4. Explain latest report */
  if(/(explain|summar|understand|what does).*(report|blood|test|document|pdf|scan)/.test(t) || /^explain/.test(t)){
    if(!reps.length) return noInfo('reports');
    const r = reps[0];
    sources.push({file:r.name,section:'Document summary'});
    let out = `**${r.name}**\n${r.type} • ${fmtD(r.date)} • Extraction confidence ${r.confidence}%\n\n`;
    out += `**Simple summary**\n${r.summary}\n\n**Important values found**\n`;
    Object.entries(r.values).forEach(([k,v])=>{
      const rf=REF[k]; const st=rangeStatus(k,v);
      out += `• ${k}: ${v}${rf?' '+rf.unit:''}`;
      if(st==='within') out += ` — within the commonly used reference range`;
      else if(st==='above') out += ` — above the commonly used reference range`;
      else if(st==='below') out += ` — below the commonly used reference range`;
      out += `\n`;
    });
    out += `\n**Questions you may want to ask your doctor**\n`;
    out += `1. What do these values mean for me specifically?\n2. Should any of these tests be repeated?\n3. Are there follow-up tests you would recommend?\n4. When should I schedule my next review?\n\n`;
    out += `_I am not a doctor and this does not replace professional medical advice._`;
    return {text:out, sources};
  }

  /* 5. Specific biomarker lookup */
  const bio = Object.keys(REF).find(k=>t.includes(k.toLowerCase()) || (k==='Hemoglobin'&&t.includes('hb')));
  if(bio){
    const r = reps.find(x=>x.values && x.values[bio]!=null);
    if(!r) return noInfo(bio);
    sources.push({file:r.name,section:bio});
    const v=r.values[bio], rf=REF[bio], st=rangeStatus(bio,v);
    let out = `**${bio}**\n\nYour value: **${v} ${rf.unit}**\nSource: ${r.name} (${fmtD(r.date)})\n\n`;
    out += `General interpretation: `;
    if(st==='within') out += `within the commonly used reference range.\n`;
    else if(st==='above') out += `above the commonly used reference range.\n`;
    else out += `below the commonly used reference range.\n`;
    out += `\nWhat this means: ${rf.about}\n\n`;
    if(cmp){
      const row = cmp.rows.find(x=>x.key===bio);
      if(row && row.prev!=null && row.curr!=null && row.dir!=='same'){
        out += `**Change detected:** ${row.prev} → ${row.curr} ${rf.unit} (${row.dir==='up'?'increase':'decrease'}) compared with ${cmp.prev.name}.\n\n`;
      }
    }
    out += `Things to discuss with your doctor:\n• What this value means in your specific situation\n• Whether any symptoms you have are related\n• Whether the test should be repeated\n\n`;
    out += `_This is general information, not a diagnosis._`;
    return {text:out, sources};
  }

  /* 6. Medicines */
  if(/(medicine|medication|tablet|pill|dose|dosage|prescription|drug)/.test(t)){
    if(!meds.length) return noInfo('medicines');
    meds.forEach(m=>sources.push({file:'Medicine List',section:m.name}));
    let out = `**Your current medicines (${meds.length})**\n\n`;
    meds.forEach(m=>{
      out += `• **${m.name}** ${m.dose} — ${m.freq}, at ${m.time}\n`;
      out += `   ${m.start} → ${m.end} • ${m.note} • ${m.taken?'✓ Taken today':'○ Upcoming today'}\n`;
    });
    out += `\nWould you like me to prepare questions about these medicines for your doctor?`;
    return {text:out, sources};
  }

  /* 7. Appointments */
  if(/(appointment|visit|consult|booking|schedule|doctor)/.test(t)){
    if(!appts.length) return noInfo('appointments');
    const up = appts.filter(a=>new Date(a.date)>=new Date(todayISO()));
    sources.push({file:'Appointment Records',section:'Upcoming appointments'});
    let out = `**Your appointments**\n\n`;
    if(up.length){
      out += `Upcoming:\n`;
      up.forEach(a=>{ out += `• ${a.doctor} (${a.spec}) — ${fmtD(a.date)} at ${a.time} • ${a.type} • ${a.status}\n`; });
    } else out += `You have no upcoming appointments.\n`;
    const past = appts.filter(a=>new Date(a.date)<new Date(todayISO()));
    if(past.length){
      out += `\nPrevious:\n`;
      past.slice(0,3).forEach(a=>{ out += `• ${a.doctor} — ${fmtD(a.date)} • ${a.status}\n`; });
    }
    return {text:out, sources};
  }

  /* 8. Doctor-visit preparation */
  if(/(prepare|question|ask my doctor|before (my )?appointment|doctor visit)/.test(t)){
    const r = reps[0];
    if(r) sources.push({file:r.name,section:'Flagged values'});
    sources.push({file:'Medicine List',section:'Current medicines'});
    let out = `**Preparation for your next appointment**\n\n`;
    if(appts[0]) out += `Appointment: ${appts[0].doctor} — ${fmtD(appts[0].date)} at ${appts[0].time}\n\n`;
    out += `**Questions to consider asking**\n`;
    out += `1. What do the changed values in my latest report mean for me?\n`;
    out += `2. Do I need to repeat any of these tests, and when?\n`;
    out += `3. Are my current medicines still appropriate?\n`;
    out += `4. Are there lifestyle changes you would recommend?\n`;
    out += `5. When should I schedule my next review?\n\n`;
    out += `**Carry with you**\n• Latest report${r?` (${r.name})`:''}\n• Medicine list (${meds.length} active)\n• This question list\n\n`;
    out += `_These are general prompts generated from your records, not medical advice._`;
    return {text:out, sources};
  }

  /* 9. Overall health journey summary */
  if(/(health journey|summar|overview|everything|all my records|across all)/.test(t)){
    if(!reps.length && !meds.length) return noInfo('health records');
    reps.slice(0,3).forEach(r=>sources.push({file:r.name,section:'Summary'}));
    let out = `**Your Health Journey Summary**\n\n`;
    out += `Records: ${reps.length} documents in your vault\n`;
    out += `Active medicines: ${meds.length}\n`;
    out += `Appointments: ${appts.length} (${appts.filter(a=>new Date(a.date)>=new Date(todayISO())).length} upcoming)\n`;
    out += `Tests: ${patientTests(pid).length}\n\n`;
    if(cmp){
      const changed = cmp.rows.filter(r=>r.dir!=='same').length;
      out += `Recent changes: ${changed} value(s) changed between ${fmtShort(cmp.prev.date)} and ${fmtShort(cmp.curr.date)}\n\n`;
    }
    out += `**Doctor discussion points**\n• Review of latest report values\n• Medicine continuation\n• Follow-up test schedule\n\n`;
    out += `**Pending tasks**\n• ${patientTests(pid).filter(x=>x.status!=='Report Ready').length} test(s) awaiting report`;
    return {text:out, sources};
  }

  /* 10. Tests */
  if(/(test|lab|sample|cbc|lipid|glucose test)/.test(t)){
    const ts = patientTests(pid);
    if(!ts.length) return noInfo('medical tests');
    sources.push({file:'Test Records',section:'Booked & completed tests'});
    let out = `**Your medical tests**\n\n`;
    ts.forEach(x=>{ out += `• ${x.name} — ${fmtD(x.date)} at ${x.time} • ${x.lab} • ${x.status}\n`; });
    return {text:out, sources};
  }

  /* 11. Fallback — honest "I don't know" */
  return {
    text:`I couldn't find this information in your available health records.\n\nI can only answer using documents, medicines and appointments that are stored in **your** HealthCopilot vault. I will not guess or invent an answer.\n\nYou could try:\n• "Explain my latest report"\n• "What changed in my blood report?"\n• "Show my medicines"\n• "Prepare questions for my doctor"\n\nIf you think a document is missing, upload it in **Health Vault** and ask me again.`,
    sources:[]
  };
}
function noInfo(what){
  return {
    text:`I couldn't find ${what} in your available health records.\n\nI only answer from information that exists in your own vault, and I won't invent an answer. Please upload the relevant document in **Health Vault** and ask me again.`,
    sources:[]
  };
}

}

function pCopilot(){
  if(!state.chat.length){
    state.chat=[{from:'ai', text:`Hello ${esc(state.user.name)}! I'm your Health Copilot. 🤖\n\nI've read the documents in your Health Vault. Ask me anything about your own health records — I'll always show you which document my answer came from.\n\nI will never guess. If your records don't contain the answer, I'll tell you.`, sources:[]}];
  }
  return `
  <div class="col" style="gap:16px">
    <div class="card pad0" style="overflow:hidden">
      <div class="chatwrap">
        <div class="row between" style="padding:14px 18px;border-bottom:1px solid var(--bd);background:#fff">
          <div class="row">
            <div class="avatar" style="width:36px;height:36px;flex:0 0 36px;font-size:16px;border-radius:11px">🤖</div>
            <div><div class="b">HealthCopilot</div><div class="xs mut">Grounded on your records • RAG enabled</div></div>
          </div>
          <span class="badge ok">● Online</span>
        </div>

        <div class="chatlog" id="chatlog">
          ${state.chat.map(m=>chatBubble(m)).join('')}
          ${state.chatBusy?`<div class="msg ai mut">HealthCopilot is thinking…</div>`:''}
        </div>

        <div style="padding:12px 14px;border-top:1px solid var(--bd);background:#fff">
          <div class="row wrap mb12" style="gap:7px">
            ${['Explain my latest report','Compare my reports','What changed in my blood report?','Show my medicines','Prepare for my appointment','Summarise my health journey']
              .map(c=>`<button class="chip" data-act="ask" data-val="${esc(c)}">${esc(c)}</button>`).join('')}
          </div>
          <div class="chatbar">
            <input id="chatInput" placeholder="Ask about your health records…" autocomplete="off" />
            <button class="btn" data-act="send">Send</button>
          </div>
          <div class="xs mut mt8">⚠️ HealthCopilot is not a doctor and does not provide diagnosis or treatment. In an emergency, contact local emergency services.</div>
        </div>
      </div>
    </div>
  </div>`;
}
function chatBubble(m){
  if(m.from==='user') return `<div class="msg user">${esc(m.text)}</div>`;
  return `<div class="msg ai ${m.urgent?'urgent':''}">
    ${fmtAI(m.text)}
    ${m.sources&&m.sources.length?`
      <div class="srcbox">
        <b>Answer grounded in</b>
        ${m.sources.map(s=>`✓ ${esc(s.file)}${s.section?` → ${esc(s.section)}`:''}`).join('<br>')}
      </div>`:''}
  </div>`;
}
function sendChat(text){
  const q = (text ?? ($('#chatInput')?.value||'')).trim();
  if(!q) return;
  state.chat.push({from:'user',text:q});
  state.chatBusy=true;
  const inp=$('#chatInput'); if(inp) inp.value='';
  render(); scrollChat();
  setTimeout(()=>{
    const r = aiRespond(q, state.activePatient);
    state.chat.push({from:'ai', text:r.text, sources:r.sources, urgent:r.urgent});
    state.chatBusy=false;
    render(); scrollChat();
  }, 520);
}
function scrollChat(){ const c=$('#chatlog'); if(c) c.scrollTop=c.scrollHeight; }

/* ------------------------------ PATIENT: COMPARE -------------------------- */
function pCompare(){
  const cmp = buildComparison(state.activePatient);
  if(!cmp) return `<div class="card center mut" style="padding:40px">You need at least two reports with extracted values to compare.<br>Upload another report in Health Vault.</div>`;
  const changed = cmp.rows.filter(r=>r.dir!=='same');
  return `
  <div class="col" style="gap:18px">
    <div class="card">
      <div class="row between mb16" style="flex-wrap:wrap;gap:10px">
        <div>
          <div class="b" style="font-size:16px">📊 Blood Test Comparison</div>
          <div class="mut sm mt8">${esc(cmp.prev.name)} (${fmtD(cmp.prev.date)}) → ${esc(cmp.curr.name)} (${fmtD(cmp.curr.date)})</div>
        </div>
        <span class="badge warn">${changed.length} VALUE(S) CHANGED</span>
      </div>

      <table>
        <thead><tr><th>Marker</th><th>Previous</th><th>Latest</th><th>Change</th><th>Reference</th></tr></thead>
        <tbody>
        ${cmp.rows.map(r=>{
          const arrow = r.dir==='up'?'↑':r.dir==='down'?'↓':'→';
          const col = r.dir==='up'?'#b45309':r.dir==='down'?'#0369a1':'#64748b';
          const unit = r.ref?' '+r.ref.unit:'';
          const stBadge = r.status==='within'?`<span class="badge ok">Within range</span>`
                        : r.status?`<span class="badge warn">${r.status==='above'?'Above':'Below'} range</span>`:'';
          return `<tr>
            <td class="b">${esc(r.key)}</td>
            <td>${r.prev ?? '—'}${unit}</td>
            <td class="b">${r.curr ?? '—'}${unit}</td>
            <td style="color:${col};font-weight:800">${arrow} ${r.dir==='same'?'No change':''}</td>
            <td>${r.ref?`${r.ref.min}–${r.ref.max}`:'—'} ${stBadge}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>

    <div class="card" style="background:var(--p3);border-color:#a5f3fc">
      <div class="b mb8">🤖 AI Summary</div>
      <div style="font-size:13.5px;line-height:1.75;color:#0e7490">
        Your latest report shows changes in <b>${changed.length}</b> value(s) compared with your previous report.
        The system highlights these values for discussion with your healthcare provider.
        This is an automated comparison of extracted values — <b>not a diagnosis</b>.
      </div>
      <div class="row mt16" style="flex-wrap:wrap">
        <button class="btn sm" data-act="ask" data-val="What changed in my blood report?">Ask AI about this</button>
        <button class="btn ghost sm" data-act="ask" data-val="Prepare questions for my doctor">Generate doctor questions</button>
      </div>
    </div>
  </div>`;
}

function pTimeline(){
  const items = DB.timeline.filter(t=>t.patientId===state.activePatient)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  const groups={};
  items.forEach(i=>{ (groups[i.date]=groups[i.date]||[]).push(i); });

  const milestones=[
    ['Profile Created',true],['First Report Uploaded',true],['First AI Summary',true],
    ['First Appointment Added',true],['Follow-up Report',items.length>6],['Doctor Summary',false]
  ];

  return `
  <div class="col" style="gap:18px">
    <div class="card">
      <div class="b mb16" style="font-size:15px">🏆 Health Journey Milestones</div>
      <div class="row wrap" style="gap:10px">
        ${milestones.map(([l,done])=>`
          <div class="row" style="gap:7px;padding:9px 14px;border-radius:11px;border:1px solid ${done?'#bbf7d0':'var(--bd)'};
            background:${done?'#f0fdf4':'#fff'};font-size:12.5px;font-weight:650;color:${done?'#15803d':'#64748b'}">
            ${done?'✓':'○'} ${l}

      </div>
    </div>

    <div class="card">
      <div class="b mb16" style="font-size:15px">🕓 Health Timeline</div>
      ${Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a)).map(date=>`
        <div class="mb16">
          <div class="b sm mb12" style="color:var(--p)">${fmtD(date)}</div>
          <div class="tl">
            ${groups[date].map(e=>`
              <div class="tli">
                <div class="row between" style="flex-wrap:wrap;gap:6px">
                  <div class="b sm">${e.icon} ${esc(e.title)}</div>
                  <div class="xs mut">${esc(e.time)}</div>

                <div class="sm mut mt8">${esc(e.desc)}</div>

  </div>`;
}

function openModal(title, bodyHTML, footHTML=''){
  closeModal();
  const bg=document.createElement('div');
  bg.className='modal-bg'; bg.id='modalBg';
  bg.innerHTML=`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-h"><h3>${esc(title)}</h3>
        <button class="btn ghost xs" data-act="closemodal">✕</button></div>
      <div class="modal-b">${bodyHTML}</div>
      ${footHTML?`<div class="modal-f">${footHTML}</div>`:''}
    </div>`;
  bg.addEventListener('click',e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const m=$('#modalBg'); if(m) m.remove(); }

function showReport(id){
  const r=DB.reports.find(x=>x.id===id); if(!r) return;
  const rows=Object.entries(r.values||{}).map(([k,v])=>{
    const rf=REF[k]; const st=rangeStatus(k,v);
    const badge = st==='within'?`<span class="badge ok">Within range</span>`
                : st==='above'?`<span class="badge warn">Above range</span>`
                : st==='below'?`<span class="badge warn">Below range</span>`:'';
    return `<tr><td class="b">${esc(k)}</td><td>${v}${rf?' '+rf.unit:''}</td>
      <td>${rf?`${rf.min}–${rf.max}`:'—'}</td><td>${badge}</td></tr>`;
  }).join('');
  openModal(r.name, `
    <div class="row between mb16" style="flex-wrap:wrap;gap:8px">
      <div><span class="badge grey">${esc(r.type)}</span> <span class="badge ok">✓ Processed</span></div>

function render(){
  const root=$('#root');
  if(state.page==='landing'){ root.innerHTML=viewLanding(); return; }
  if(state.page==='login'){ root.innerHTML=viewLogin(); return; }
  if(state.role==='patient'){ root.innerHTML=shell(P_NAV,'Patient Portal'); return; }
  if(state.role==='doctor'){ root.innerHTML=doctorShell(); return; }
  if(state.role==='admin'){ root.innerHTML=adminShell(); return; }
  root.innerHTML=viewLanding();
}

/* ============================================================================
   EVENT DELEGATION
   ============================================================================ */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, val = el.dataset.val;
  const pid = state.activePatient;

  switch(act){

    case 'go': state.page=val; render(); break;
    case 'tab': state.loginTab=val; render(); break;
    case 'forgot': toast('Demo mode — use the demo account buttons below'); break;
    case 'signup': toast('Demo mode — please use the demo accounts'); break;
    case 'demo': {
      const map={patient:['patient@healthcopilot.com','Patient@123'],
                 doctor:['doctor@healthcopilot.com','Doctor@123'],
                 admin:['admin@healthcopilot.com','Admin@123']};
      const [em,pw]=map[val]; login(em,pw); break;
    }
    case 'login': {
      const em=$('#loginEmail')?.value||'', pw=$('#loginPw')?.value||'';
      if(!em||!pw){ toast('Enter email and password','dn'); break; }
      login(em,pw); break;
    }
    case 'logout': logout(); break;
    case 'closemodal': closeModal(); break;
    case 'noop': toast('Demo action — not wired to a backend'); break;

    case 'nav':
      if(val===''||val===undefined) break;
      state.nav=val; closeModal(); render(); window.scrollTo(0,0); break;

    case 'ask':
      state.nav='copilot'; state.chat.push({from:'user',text:val}); state.chatBusy=true;
      render();
      setTimeout(()=>{
        const r=aiRespond(val,pid);
        state.chat.push({from:'ai',text:r.text,sources:r.sources,urgent:r.urgent});
        state.chatBusy=false; render(); scrollChat();
      },480);
      break;

    case 'send': sendChat(); break;

    /* ---- Vault ---- */
    case 'upload': simulateUpload(); break;
    case 'vaultfilter': state.vaultFilter=val; render(); break;
    case 'viewreport': showReport(val); break;

    /* ---- Medicines ---- */
    case 'takemed': {
      const m=DB.medicines.find(x=>x.id===val);
      if(m){ m.taken=true; saveDB();
        DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
          time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
          icon:'💊',title:'Medicine marked as taken',desc:`${m.name} ${m.dose}`});
        DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:pid,action:'MEDICINE_TAKEN',target:m.id});
        saveDB(); toast('Marked as taken ✓','ok'); render(); }
      break;
    }
    case 'addmed': {
      const n=$('#mName')?.value.trim();
      if(!n){ toast('Enter a medicine name','dn'); break; }
      DB.medicines.push({id:uid('MED'),patientId:pid,name:n,dose:$('#mDose')?.value||'—',
        freq:$('#mFreq')?.value||'Once daily',time:$('#mTime')?.value||'08:00 AM',
        start:$('#mStart')?.value||todayISO(),end:$('#mEnd')?.value||daysFromNow(5),
        note:$('#mNote')?.value||'—',taken:false,source:'Manual'});
      DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'💊',title:'Medicine Added',desc:`${n} added to tracker`});
      saveDB(); toast('Medicine added ✓','ok'); render(); break;
    }
    case 'rx2med': {
      const rx=DB.prescriptions.find(x=>x.id===val); if(!rx) break;
      let added=0;
      rx.items.forEach(i=>{
        if(!DB.medicines.some(m=>m.name===i.name && m.patientId===pid)){
          DB.medicines.push({id:uid('MED'),patientId:pid,name:i.name,dose:i.dose,freq:i.freq,
            time:'08:00 AM',start:rx.date,end:daysFromNow(7),note:i.note,taken:false,source:'Prescription'});
          added++;
        }
      });
      saveDB(); toast(added?added+' medicine(s) added from prescription ✓':'Already in your tracker','ok');
      render(); break;
    }

    /* ---- Appointments ---- */
    case 'bookdoc': closeModal(); showBooking(val); break;
    case 'docprofile': showDoctorProfile(val); break;
    case 'confirmbooking': {
      const d=DB.doctors.find(x=>x.id===val); if(!d) break;
      const a={id:uid('AP').replace('AP-','AP-10'),patientId:pid,doctorId:d.id,doctor:d.name,spec:d.spec,
        date:$('#bkDate')?.value||daysFromNow(2),time:$('#bkTime')?.value||d.slots[0],
        type:$('#bkType')?.value||'In-person',reason:$('#bkReason')?.value||'General consultation',
        status:'Confirmed'};
      DB.appointments.push(a);
      DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'📅',title:'Appointment booked',desc:`${d.name} — ${fmtD(a.date)} at ${a.time}`});
      DB.notifications.unshift({id:uid('N'),patientId:pid,icon:'📅',title:'Appointment confirmed',
        desc:`${d.name} — ${fmtD(a.date)} at ${a.time}`,time:'just now',read:false});
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:pid,action:'BOOK_APPOINTMENT',target:a.id});
      saveDB(); closeModal(); toast('Appointment confirmed ✓','ok');
      state.nav='appointments'; render(); break;
    }
    case 'join': showVideoRoom(val); break;
    case 'reschedule': {
      const a=DB.appointments.find(x=>x.id===val); if(!a) break;
      a.date=daysFromNow(3); a.status='Confirmed';
      DB.notifications.unshift({id:uid('N'),patientId:pid,icon:'📅',title:'Appointment rescheduled',
        desc:`${a.doctor} — new date ${fmtD(a.date)}`,time:'just now',read:false});
      saveDB(); toast('Appointment rescheduled ✓','ok'); render(); break;
    }
    case 'cancelappt': {
      const i=DB.appointments.findIndex(x=>x.id===val); if(i<0) break;
      DB.appointments[i].status='Cancelled'; saveDB();
      toast('Appointment cancelled','dn'); render(); break;
    }

    /* ---- Tests ---- */
    case 'booktest': {
      const n=$('#tName')?.value||'CBC';
      DB.tests.push({id:uid('TST'),patientId:pid,name:n,date:$('#tDate')?.value||daysFromNow(3),
        time:$('#tTime')?.value||'09:30 AM',lab:$('#tLab')?.value||'ABC Diagnostics',
        status:'Booked',by:'Self'});
      DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'🧪',title:'Test booked',desc:`${n} — ${$('#tLab')?.value||'ABC Diagnostics'}`});
      saveDB(); toast('Test booked ✓','ok'); render(); break;
    }

    /* ---- Sharing ---- */
    case 'share': {
      const docId=$('#shDoc')?.value;
      const d=DB.doctors.find(x=>x.id===docId); if(!d) break;
      const scopes=$$('.shItem').filter(c=>c.checked).map(c=>c.value);
      if(!scopes.length){ toast('Select at least one record','dn'); break; }
      const dur=$('#shDur')?.value||'7 days';
      const days = dur==='24 hours'?1 : dur==='One appointment'?1 : 7;
      const exp=new Date(); exp.setDate(exp.getDate()+days);
      DB.shares.push({id:uid('SH'),patientId:pid,doctorId:d.id,doctor:d.name,
        scopes,granted:todayISO(),expires:exp.toISOString().slice(0,10),duration:dur,revoked:false});
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:pid,action:'GRANT_ACCESS',target:d.id});
      saveDB(); toast('Records shared with '+d.name+' ✓','ok'); render(); break;
    }
    case 'revoke': {
      const s=DB.shares.find(x=>x.id===val); if(!s) break;
      s.revoked=true;
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:pid,action:'REVOKE_ACCESS',target:s.doctorId});
      saveDB(); toast('Access revoked','dn'); render(); break;
    }
    case 'sharelink':
      toast('Temporary link generated (24h) — demo only','ok'); break;

    /* ---- Emergency ---- */
    case 'emcard': toast('Emergency card updated ✓','ok'); break;
    case 'printcard': window.print(); break;

    /* ---- Messages ---- */
    case 'sendmsg': {
      const t=$('#msgInput')?.value.trim(); if(!t) break;
      DB.messages.push({id:uid('M'),patientId:pid,doctorId:'DOC-001',from:'patient',text:t,
        time:new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
      saveDB(); render();
      setTimeout(()=>{ $('#msgInput')?.focus(); },50);
      break;
    }

    /* ---- Notifications ---- */
    case 'readall':
      DB.notifications.filter(n=>n.patientId===pid).forEach(n=>n.read=true);
      saveDB(); render(); toast('All marked as read','ok'); break;

    /* ---- Settings ---- */
    case 'savesettings':
      DB.settings.language=$('#setLang')?.value||'English';
      DB.settings.retention=$('#setRetention')?.value||'until-delete';
      DB.settings.aiConsent=$('#setConsent')?.checked??true;
      DB.settings.maskPII=$('#setMask')?.checked??true;
      DB.settings.voice=$('#setVoice')?.checked??false;
      saveDB(); toast('Settings saved ✓','ok'); break;
    case 'resetdemo': resetDB(); state.nav='dashboard'; render(); break;

    /* ---- Doctor actions ---- */
    case 'gensummary':
      toast('AI summary regenerated from authorized records ✓','ok'); break;
    case 'structnotes':
      toast('Notes structured by AI — review before saving ✓','ok'); break;
    case 'savenotes':
      DB.notes.push({id:uid('CN'),patientId:'HC-P001',doctorId:'DOC-001',date:todayISO(),
        chief:'Headache for 3 days',symptoms:'Mild headache, worse in evening',
        history:'Recent CBC — hemoglobin improving',doctorNotes:$('#cnNotes')?.value||'',
        followup:daysFromNow(14),instructions:$('#cnInstr')?.value||''});
      DB.timeline.push({id:uid('TL'),patientId:'HC-P001',date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'📝',title:'Consultation notes added',desc:'Dr. Ravi Kumar saved consultation notes'});
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:'DOC-001',action:'ADD_NOTES',target:'HC-P001'});
      saveDB(); toast('Consultation notes saved ✓','ok'); render(); break;
    case 'addrxrow': {
      const tb=$('#rxRows'); if(!tb) break;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><input placeholder="Medicine" /></td><td><input placeholder="Dosage" /></td>
        <td><input placeholder="Frequency" /></td><td><input placeholder="Duration" /></td>
        <td><input placeholder="Instructions" /></td>`;
      tb.appendChild(tr); break;
    }
    case 'signrx': {
      const rows=$$('#rxRows tr').map(tr=>{
        const ins=$$('input',tr).map(i=>i.value.trim());
        return {name:ins[0]||'—',dose:ins[1]||'—',freq:ins[2]||'—',dur:ins[3]||'—',note:ins[4]||'—'};
      }).filter(x=>x.name!=='—');
      DB.prescriptions.push({id:uid('RX'),patientId:'HC-P001',doctorId:'DOC-001',
        doctor:'Dr. Ravi Kumar',date:todayISO(),items:rows,notes:$('#rxNotes')?.value||''});
      DB.notifications.unshift({id:uid('N'),patientId:'HC-P001',icon:'📋',title:'New prescription received',
        desc:`Dr. Ravi Kumar issued a prescription (${rows.length} medicine(s))`,time:'just now',read:false});
      DB.timeline.push({id:uid('TL'),patientId:'HC-P001',date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'📋',title:'Prescription received',desc:`${rows.length} medicine(s) prescribed by Dr. Ravi Kumar`});
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:'DOC-001',action:'CREATE_PRESCRIPTION',target:'HC-P001'});
      saveDB(); toast('Prescription signed & sent ✓','ok'); render(); break;
    }
    case 'savefollowup': {
      DB.followups.push({id:uid('FU'),patientId:'HC-P001',doctorId:'DOC-001',doctor:'Dr. Ravi Kumar',
        date:$('#fuDate')?.value||daysFromNow(14),reason:$('#fuReason')?.value||'Review',status:'Upcoming'});
      DB.notifications.unshift({id:uid('N'),patientId:'HC-P001',icon:'🔁',title:'Follow-up scheduled',
        desc:`Dr. Ravi Kumar — ${fmtD($('#fuDate')?.value||daysFromNow(14))}`,time:'just now',read:false});
      DB.timeline.push({id:uid('TL'),patientId:'HC-P001',date:todayISO(),
        time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
        icon:'🔁',title:'Follow-up scheduled',desc:$('#fuReason')?.value||'Review'});
      saveDB(); toast('Follow-up saved ✓','ok'); render(); break;
    }

    /* ---- Admin actions ---- */
    case 'verify': {
      const d=DB.doctors.find(x=>x.id===val); if(!d) break;
      d.verified=true; d.status='Verified';
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:'ADM-001',action:'VERIFY_DOCTOR',target:d.id});
      saveDB(); toast(d.name+' verified ✓','ok'); render(); break;
    }
    case 'reject': {
      const d=DB.doctors.find(x=>x.id===val); if(!d) break;
      d.status='Rejected';
      DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:'ADM-001',action:'REJECT_DOCTOR',target:d.id});
      saveDB(); toast(d.name+' rejected','dn'); render(); break;
    }
  }
});

/* --- live inputs --- */
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.dataset.act==='vaultsearch'){ state.vaultSearch=el.value; render();
    const i=$('#vaultSearch'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
  if(el.dataset.act==='docsearch'){ state.docSearch=el.value; render();
    const i=$('#docSearch'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='chatInput'){ e.preventDefault(); sendChat(); }
  if(e.key==='Enter' && e.target.id==='msgInput'){ e.preventDefault(); sendChat2(); }
  if(e.key==='Escape') closeModal();
});
function sendChat2(){
  const t=$('#msgInput')?.value.trim(); if(!t) return;
  DB.messages.push({id:uid('M'),patientId:state.activePatient,doctorId:'DOC-001',from:'patient',text:t,
    time:new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})});
  saveDB(); render();
  setTimeout(()=>{ const i=$('#msgInput'); if(i) i.focus(); },60);
}

/* --- simulated upload pipeline --- */
function simulateUpload(){
  const box=$('#uploadProg'); if(!box) return;
  box.classList.remove('hidden');
  const stages=['Uploading…','OCR / text extraction…','AI classification…','Extracting important values…','Generating simple explanation…','Saving to Health Vault…'];
  let p=0, s=0;
  const bar=$('#upBar'), pct=$('#upPct'), stg=$('#upStage');
  const iv=setInterval(()=>{
    p+=Math.random()*16+8;
    if(p>100) p=100;
    const si=Math.min(stages.length-1, Math.floor(p/100*stages.length));
    if(bar) bar.style.width=p+'%';
    if(pct) pct.textContent=Math.round(p)+'%';
    if(stg) stg.textContent=stages[si];
    if(p>=100){
      clearInterval(iv);
      setTimeout(()=>{
        const pid=state.activePatient;
        const n=patientReports(pid).length+1;
        const newR={
          id:uid('RPT'),patientId:pid,
          name:`Blood_Report_${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).replace(' ','')}_${new Date().getFullYear()}.pdf`,
          type:'Blood Test',date:todayISO(),status:'processed',size:(Math.floor(Math.random()*400)+200)+' KB',
          confidence:Math.floor(Math.random()*8)+91,
          values:{Hemoglobin:13.1,WBC:7400,Platelets:2.25,Glucose:99,Cholesterol:192},
          summary:'Complete blood count with metabolic panel. Values were extracted automatically and are shown for your review. This is not a diagnosis.'
        };
        DB.reports.push(newR);
        DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
          time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
          icon:'📄',title:'Blood Report Uploaded',desc:newR.name+' added to Health Vault'});
        DB.timeline.push({id:uid('TL'),patientId:pid,date:todayISO(),
          time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),
          icon:'🤖',title:'AI Summary Generated',desc:`AI extracted ${Object.keys(newR.values).length} values`});
        DB.notifications.unshift({id:uid('N'),patientId:pid,icon:'📄',title:'Report processing completed',
          desc:newR.name+' is ready to view',time:'just now',read:false});
        DB.auditLogs.push({id:uid('AL'),time:new Date().toLocaleString(),actor:pid,action:'UPLOAD_REPORT',target:newR.id});
        saveDB();
        toast('Report processed and saved to your vault ✓','ok');
        render();
      },420);
    }
  },320);
}

   INIT
   ============================================================================ */
loadDB();
render();
